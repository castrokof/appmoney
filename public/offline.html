<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Sin conexión · Cobros</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;text-align:center;padding:1.5rem}
  .box{max-width:340px}
  h1{font-size:1.4rem;margin:.5rem 0}
  p{opacity:.85;line-height:1.5}
  button{margin-top:1rem;border:0;border-radius:999px;padding:.8rem 1.6rem;font-weight:700;font-size:1rem;background:#fff;color:#4f46e5}
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:3.5rem">📡</div>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Los cobros se registran en línea, así que vuelve a intentarlo cuando tengas señal.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
